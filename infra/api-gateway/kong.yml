_format_version: "3.0"

# Local/dev gateway. Routes /api/v1/<prefix> → upstream service. Rate-limit
# tiers are dev-relaxed (high) so the e2e suite isn't 429'd; production runs its
# own Kong config with real limits.
services:
  - name: auth-service
    url: http://auth-service:3000
    routes:
      - name: auth-routes
        paths: ["/api/v1/auth"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100000
          policy: redis
          redis_host: redis

  - name: profile-service
    url: http://profile-service:3000
    routes:
      - name: profile-routes
        paths: ["/api/v1/profile", "/api/v1/weight-entries"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100000
          policy: redis
          redis_host: redis

  - name: nutrition-service
    url: http://nutrition-service:3000
    routes:
      - name: nutrition-routes
        paths:
          [
            "/api/v1/foods",
            "/api/v1/journal",
            "/api/v1/hydration",
            "/api/v1/supplements",
          ]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100000
          policy: redis
          redis_host: redis

  - name: workout-service
    url: http://workout-service:3000
    routes:
      - name: workout-routes
        paths: ["/api/v1/exercises", "/api/v1/workouts"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100000
          policy: redis
          redis_host: redis

  - name: notification-service
    url: http://notification-service:3000
    routes:
      - name: notification-routes
        paths: ["/api/v1/notifications", "/api/v1/notification-preferences"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100000
          policy: redis
          redis_host: redis

plugins:
  - name: cors
    config:
      origins: ["http://localhost:*"]
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Accept, Authorization, Content-Type]
      credentials: true
