_format_version: "3.0"

# Local/dev gateway. Routes /api/v1/<prefix> → upstream service. Rate-limit
# tiers are dev-relaxed (high) so the e2e suite isn't 429'd; production runs its
# own Kong config with real limits.
services:
  - name: example-service
    url: http://example-service:3000
    routes:
      - name: example-routes
        paths: ["/api/v1/places"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100000
          policy: redis
          redis_host: redis

plugins:
  - name: cors
    config:
      origins: ["http://localhost:*"]
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Accept, Authorization, Content-Type]
      credentials: true
